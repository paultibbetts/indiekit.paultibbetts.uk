name: Build/check Docker image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: gitea.cloud.paultibbetts.uk
  IMAGE_NAME: paul/indiekit.paultibbetts.uk

jobs:
  build:
    name: Build/check image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: https://gitea.cloud.paultibbetts.uk/actions/checkout@v4

      - name: Prepare image tags
        run: |
          set -e

          image="${REGISTRY}/${IMAGE_NAME}"
          tags_file="$(mktemp)"
          printf "%s\n" "${image}:${GITHUB_SHA}" > "${tags_file}"

          case "${GITHUB_REF}" in
            refs/heads/main)
              printf "%s\n" "${image}:latest" >> "${tags_file}"
              ;;
            refs/heads/*)
              branch_tag="$(printf "%s" "${GITHUB_REF#refs/heads/}" | tr "/" "-")"
              printf "%s\n" "${image}:${branch_tag}" >> "${tags_file}"
              ;;
            refs/tags/*)
              printf "%s\n" "${image}:${GITHUB_REF#refs/tags/}" >> "${tags_file}"
              ;;
          esac

          {
            echo "IMAGE_TAGS<<EOF"
            cat "${tags_file}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: Log in to Gitea container registry
        uses: https://gitea.cloud.paultibbetts.uk/docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: paul
          password: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build image
        uses: https://gitea.cloud.paultibbetts.uk/docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ env.IMAGE_TAGS }}
